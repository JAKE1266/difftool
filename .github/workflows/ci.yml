name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: 测试(${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 运行单元测试
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: 冒烟测试(有差异 → 退出码 1)
        run: |
          python -m difftool --version
          printf 'apple\nbanana\ncherry\n' > a.txt
          printf 'apple\nbanana\ngrape\n' > b.txt
          python -m difftool a.txt b.txt --stat
          python -m difftool a.txt a.txt --json
